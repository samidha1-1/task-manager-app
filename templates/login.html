{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<div class="auth-card">

    <h1>Welcome Back in task-manager-app</h1>

    <p>Login to manage your tasks.</p>

    <form method="POST">

        <label>Email</label>

        <input
            type="email"
            name="email"
            required
        >

        <label>Password</label>

        <input
            type="password"
            name="password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <p class="switch">

        Don't have an account?

        <a href="{{ url_for('register') }}">
            Create one
        </a>

    </p>

</div>

{% endblock %}
